<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register - LeaveFlow</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="auth">
  <aside class="auth-side">
    <a class="brand" href="index.html"><span class="brand-mark">LF</span>LeaveFlow</a>
    <div><h2>Create your account</h2><p>Join your team on LeaveFlow and start applying for leave in minutes.</p>
      <ul class="auth-points"><li>✔ Real-time leave balances</li><li>✔ Instant approval notifications</li><li>✔ Team leave calendar</li></ul></div>
    <small style="opacity:.7;position:relative">IMS academic project</small>
  </aside>
  <main class="auth-main"><div class="auth-card">
    <h1>Register</h1><p class="muted">It only takes a minute.</p>
    <div class="seg" id="roleSeg"><button type="button" class="on" data-role="Employee">Employee</button><button type="button" data-role="Administrator">Administrator</button></div>
    <form id="registerForm" novalidate>
      <label class="field">Full name<input id="name" placeholder="e.g. Priya Sharma" autocomplete="name" required></label>
      <div class="form-row">
        <label class="field">Email address<input id="email" type="email" placeholder="you@example.com" autocomplete="email" required></label>
        <label class="field">Phone (optional)<input id="phone" type="tel" placeholder="98765 43210" autocomplete="tel"></label>
      </div>
      <label class="field">Department<select id="department"></select></label>
      <label class="field hidden" id="codeField">Administrator access code<input id="adminCode" placeholder="Enter access code"><small>Demo code: <b>ADMIN2026</b></small></label>
      <div class="form-row">
        <label class="field">Password<div class="pw-wrap"><input id="password" type="password" placeholder="Min. 6 characters" autocomplete="new-password" required><button type="button" data-toggle="password">Show</button></div><div class="strength"><i id="strength"></i></div></label>
        <label class="field">Confirm password<input id="confirm" type="password" placeholder="Repeat password" autocomplete="new-password" required></label>
      </div>
      <p id="err" class="form-error"></p>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Create account</button>
    </form>
    <p class="auth-alt">Already registered? <a href="login.html">Log in</a></p>
  </div></main>
</div>
<script src="js/store.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script>
</body></html>
